stages:
  - lint
  - test
  - build
  - deploy

variables:
  DOCKER_REGISTRY: "registry.example.com"
  BACKEND_IMAGE: "$DOCKER_REGISTRY/epms/backend"
  FRONTEND_IMAGE: "$DOCKER_REGISTRY/epms/frontend"

# -----------------
# LINT & TEST
# -----------------
lint_backend:
  stage: lint
  image: node:20-alpine
  script:
    - cd backend
    - npm install
    - npm run lint

lint_frontend:
  stage: lint
  image: node:20-alpine
  script:
    - cd frontend
    - npm install
    - npm run lint

test_backend:
  stage: test
  image: node:20-alpine
  script:
    - cd backend
    - npm install
    - npm run test

test_frontend:
  stage: test
  image: node:20-alpine
  script:
    - cd frontend
    - npm install
    - npm run test

# -----------------
# BUILD DOCKER
# -----------------
build_backend:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  script:
    - docker build -t $BACKEND_IMAGE:$CI_COMMIT_SHA ./backend
    - docker push $BACKEND_IMAGE:$CI_COMMIT_SHA
  only:
    - main

build_frontend:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  script:
    - docker build -t $FRONTEND_IMAGE:$CI_COMMIT_SHA ./frontend
    - docker push $FRONTEND_IMAGE:$CI_COMMIT_SHA
  only:
    - main

# -----------------
# DEPLOY K8S
# -----------------
deploy_k8s:
  stage: deploy
  image: bitnami/kubectl:latest
  script:
    - kubectl set image deployment/epms-backend backend=$BACKEND_IMAGE:$CI_COMMIT_SHA -n epms-prod
    - kubectl set image deployment/epms-frontend frontend=$FRONTEND_IMAGE:$CI_COMMIT_SHA -n epms-prod
  only:
    - main
